<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11 - Grid Vertical Alignment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
</head>
<body>

<div class="container py-4">
    <h2>Vertical Alignment</h2>

    <!-- align-items-center vertically centers the columns -->
    <div class="row align-items-center bg-light" style="height: 250px;">
        <div class="col-md-4 bg-success text-white p-3">
            Left content
        </div>

        <div class="col-md-4 bg-warning p-3">
            Center content
        </div>

        <div class="col-md-4 bg-danger text-white p-3">
            Right content
        </div>
    </div>

    <div class="mt-4">
        <code>align-items-start</code>,
        <code>align-items-center</code>,
        <code>align-items-end</code>
        control vertical alignment.
    </div>
</div>

</body>
</html>
