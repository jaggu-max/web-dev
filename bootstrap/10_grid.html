<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 - Grid</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
</head>
<body>

<div class="container py-4">
    <h2>Bootstrap Grid System</h2>
    <p>Bootstrap divides a row into 12 columns.</p>

    <div class="row mb-3">
        <div class="col-4 bg-success text-white p-3">4 columns</div>
        <div class="col-8 bg-danger text-white p-3">8 columns</div>
    </div>

    <div class="row">
        <div class="col-md-2 bg-primary text-white p-3">2</div>
        <div class="col-md-8 bg-warning p-3">8</div>
        <div class="col-md-2 bg-success text-white p-3">2</div>
    </div>
</div>

</body>
</html>
