<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - Badges</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
</head>
<body>

<div class="container py-4">
    <h2>Badges</h2>

    <!-- A badge is a small label/count attached to content -->
    <button class="btn btn-primary">
        Followers <span class="badge text-bg-light">100+</span>
    </button>

    <button class="btn btn-dark">
        Notifications <span class="badge text-bg-danger">5</span>
    </button>

    <h3 class="mt-4">
        Messages <span class="badge text-bg-warning">12</span>
    </h3>

    <p>Status: <span class="badge text-bg-success">Online</span></p>
</div>

</body>
</html>
