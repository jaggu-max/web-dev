<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 - Container</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
</head>
<body>

<div class="container py-4">
    <h2>container</h2>
    <div class="bg-primary text-white p-3 mb-4">
        This uses <code>container</code>. It has responsive maximum widths.
    </div>
</div>

<div class="container-fluid">
    <h2>container-fluid</h2>
    <div class="bg-success text-white p-3">
        This uses <code>container-fluid</code>. It uses almost the full screen width.
    </div>
</div>

</body>
</html>
