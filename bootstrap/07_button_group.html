<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07 - Button Group</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
</head>
<body>

<div class="container py-4">
    <h2>Button Group</h2>

    <!-- Buttons placed together as one group -->
    <div class="btn-group" role="group">
        <button class="btn btn-outline-primary">One</button>
        <button class="btn btn-outline-primary">Two</button>
        <button class="btn btn-outline-primary">Three</button>
    </div>

    <h4 class="mt-4">Vertical group</h4>
    <div class="btn-group-vertical">
        <button class="btn btn-success">Home</button>
        <button class="btn btn-success">Contact</button>
        <button class="btn btn-success">About</button>
    </div>
</div>

</body>
</html>
