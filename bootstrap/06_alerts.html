<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06 - Alerts</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
</head>
<body>

<div class="container py-4">
    <h2>Alerts</h2>

    <div class="alert alert-primary">This is a primary alert.</div>
    <div class="alert alert-success">Success! Your profile was updated.</div>
    <div class="alert alert-danger">Error! Something went wrong.</div>
    <div class="alert alert-warning">Warning! Check your information.</div>
    <div class="alert alert-info">Info: Your course starts tomorrow.</div>
</div>

</body>
</html>
