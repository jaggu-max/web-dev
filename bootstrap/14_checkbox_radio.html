<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14 - Checkbox and Radio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
</head>
<body>

<div class="container py-4">
    <h2>Checkbox & Radio</h2>

    <h4>Normal HTML checkbox</h4>
    <div class="mb-3">
        <input type="checkbox" id="normalAgree">
        <label for="normalAgree">I agree</label>
    </div>

    <h4>Bootstrap checkbox</h4>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="bootstrapAgree">
        <label class="form-check-label" for="bootstrapAgree">
            I agree to the terms
        </label>
    </div>

    <h4>Radio buttons</h4>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="gender" id="male">
        <label class="form-check-label" for="male">Male</label>
    </div>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="gender" id="female">
        <label class="form-check-label" for="female">Female</label>
    </div>
</div>

</body>
</html>
